<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · InnovateK12 District Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --deep-teal:   #176E82;
  --charcoal:    #092c34;
  --sydney-teal: #219EBB;
  --orange:      #ea730b;
  --white:       #ffffff;
  --bg:          #f2f5f7;
  --border:      #e0e6e9;
  --text-body:   #2c3e45;
  --text-mid:    #5a6f76;
  --text-faint:  #8fa3ab;
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Open Sans',-apple-system,sans-serif;color:var(--text-body);}

body{
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  background:linear-gradient(145deg, var(--charcoal) 0%, #0d3d4a 60%, #0a2e38 100%);
}

.login-wrap{
  width:100%;max-width:420px;padding:20px;
}

.login-card{
  background:var(--white);
  border-radius:12px;
  box-shadow:0 24px 64px rgba(0,0,0,.35);
  overflow:hidden;
}

/* ── Header ── */
.card-header{
  background:var(--charcoal);
  padding:30px 36px 26px;
  text-align:center;
  border-bottom:2px solid var(--orange);
}

.ik12-logo{
  display:flex;align-items:center;justify-content:center;
  font-family:'Open Sans',sans-serif;font-weight:700;font-size:21px;letter-spacing:-.01em;
  margin-bottom:10px;
}
.ik12-logo .inn  {color:var(--deep-teal);}
.ik12-logo .atom {color:var(--sydney-teal);font-size:25px;margin:0 2px;}
.ik12-logo .vate {color:var(--deep-teal);}
.ik12-logo .pipe {color:rgba(255,255,255,.22);margin:0 10px;font-weight:300;}
.ik12-logo .k12  {color:var(--orange);font-size:23px;}

.product-label{
  font-family:'Lora',serif;font-size:10.5px;font-weight:600;
  color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase;
}

/* ── Body ── */
.card-body{padding:32px 36px 28px;}

.card-body h2{
  font-family:'Lora',serif;font-size:19px;font-weight:600;
  color:var(--text-body);margin-bottom:5px;
}
.card-body .subtitle{
  font-size:12.5px;color:var(--text-mid);margin-bottom:26px;line-height:1.5;
}

.error-banner{
  display:none;
  background:#fdecea;border:1px solid #f5c6c2;border-radius:6px;
  padding:10px 14px;font-size:12.5px;color:#c0392b;
  margin-bottom:20px;line-height:1.4;
}
.error-banner.show{display:block;}

.field{margin-bottom:18px;}
.field label{
  display:block;font-size:10.5px;font-weight:700;
  color:var(--text-mid);text-transform:uppercase;letter-spacing:.07em;
  margin-bottom:6px;
}
.field input{
  width:100%;padding:11px 14px;
  border:1.5px solid var(--border);border-radius:7px;
  font-family:'Open Sans',sans-serif;font-size:13.5px;color:var(--text-body);
  background:var(--bg);outline:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.field input:focus{
  border-color:var(--deep-teal);
  box-shadow:0 0 0 3px rgba(23,110,130,.13);
  background:#fff;
}

.btn-login{
  display:block;width:100%;padding:12px;margin-top:24px;
  background:var(--deep-teal);color:#fff;
  border:none;border-radius:7px;
  font-family:'Open Sans',sans-serif;font-size:13.5px;font-weight:700;
  letter-spacing:.03em;cursor:pointer;
  transition:background .15s,transform .1s,box-shadow .15s;
  box-shadow:0 4px 12px rgba(23,110,130,.28);
}
.btn-login:hover{background:#145f70;box-shadow:0 6px 16px rgba(23,110,130,.35);}
.btn-login:active{transform:scale(.98);}

/* ── Footer ── */
.card-footer{
  border-top:1px solid var(--border);
  padding:14px 36px;text-align:center;
  font-size:10.5px;color:var(--text-faint);letter-spacing:.02em;
}
.card-footer span{color:var(--orange);font-weight:600;}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">

    <div class="card-header">
      <div class="ik12-logo">
        <span class="inn">INN</span>
        <span class="atom">⚛</span>
        <span class="vate">VATE</span>
        <span class="pipe">|</span>
        <span class="k12">K12</span>
      </div>
      <div class="product-label">District Hub</div>
    </div>

    <div class="card-body">
      <h2>Welcome</h2>
      <p class="subtitle">Sign in to access your District Hub demo.</p>

      <div class="error-banner" id="errorBanner">
        Incorrect username or password. Please try again.
      </div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username"
                 autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-login">Sign In</button>
      </form>
    </div>

    <div class="card-footer">
      <span>Confidential</span> · For authorized preview only
    </div>

  </div>
</div>

<script>
  // Demo credentials — change these to match your CLIENTS env var
  var DEMO_USERS = {
    'demo':  'innovatek12',
    'admin': 'innovatek12'
  };

  if (new URLSearchParams(location.search).get('error')) {
    document.getElementById('errorBanner').classList.add('show');
  }

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value.trim();
    if (DEMO_USERS[u] && DEMO_USERS[u] === p) {
      sessionStorage.setItem('ik12_auth', u);
      var base = location.pathname.replace(/[^/]*$/, '');
      location.replace(base + 'index.html');
    } else {
      document.getElementById('errorBanner').classList.add('show');
    }
  });
</script>
</body>
</html>
